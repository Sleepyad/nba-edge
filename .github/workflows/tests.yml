name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ["nba_edge.py", "docs/index.html", "tests/**"]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -v
